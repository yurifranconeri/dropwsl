# users_data/credentials.example.yaml
#
# Template file. Copy to `credentials.yaml` (which is gitignored AND
# dockerignored) and populate via the CLI:
#
#     cp users_data/credentials.example.yaml users_data/credentials.yaml
#     python -m {{PKG_PREFIX}}users add alice
#
# NEVER paste real bcrypt hashes into this file. The example values below
# are placeholders that will fail verification at runtime.

users:
  example_admin:
    name: Example Admin
    email: admin@example.com
    password_hash: <bcrypt-hash-generated-by-cli>
    role: admin
  example_viewer:
    name: Example Viewer
    email: viewer@example.com
    password_hash: <bcrypt-hash-generated-by-cli>
